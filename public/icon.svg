  The same mark as src-tauri/icons/app-icon.svg, redrawn for 32 pixels: at this
  size the strokes have to be proportionally heavier and the clock loses its
  hands, which would turn into a smudge. Kept in step with the application icon
  on purpose, so the window and the dock show the same thing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#18181b" />
  <g
    stroke="#34d399"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="6" y="8" width="16" height="13.5" rx="2" />
    <path d="M6 17.5l4-4 4.5 4.5" />
    <circle cx="17.5" cy="12" r="1.4" />
    <circle cx="21.5" cy="21.5" r="5" fill="#18181b" />
    <path d="M21.5 18.7v2.9l1.9 1.4" />
  </g>
</svg>
