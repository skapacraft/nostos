name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Il controllo che tiene in piedi la promessa del progetto. Gira per primo e
  # da solo: se qualcuno introduce una crate di rete, deve essere la prima cosa
  # che si vede fallire, non una riga persa in fondo a un log di build.
  privacy:
    name: Vincolo local-first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installa cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Nessuna crate di rete, telemetria o updater
        working-directory: src-tauri
        run: cargo deny check

      - name: Nessuna fetch o XMLHttpRequest nel frontend
        run: |
          # La CSP le bloccherebbe comunque a runtime, ma un errore in console
          # è una diagnosi peggiore di una build che fallisce.
          if grep -rnE '\b(fetch|XMLHttpRequest|WebSocket|EventSource)\s*\(' src/; then
            echo "::error::Trovata una primitiva di rete nel frontend."
            exit 1
          fi
          echo "Nessuna primitiva di rete nel frontend."

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dipendenze di sistema Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - name: Formattazione
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --all-targets

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Controllo dei tipi e build
        run: npm run build
