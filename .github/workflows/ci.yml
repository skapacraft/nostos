name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The check that holds up the project's promise. It runs first and on its own:
  # if anyone introduces a network crate, that has to be the first thing seen
  # failing, not a line lost at the bottom of a build log.
  privacy:
    name: Local-first constraint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: No network, telemetry or updater crates
        working-directory: src-tauri
        run: cargo deny check

      - name: No fetch or XMLHttpRequest in the frontend
        run: |
          # The CSP would block them at runtime anyway, but a console error is
          # a worse diagnosis than a failing build.
          if grep -rnE '\b(fetch|XMLHttpRequest|WebSocket|EventSource)\s*\(' src/; then
            echo "::error::Found a networking primitive in the frontend."
            exit 1
          fi
          echo "No networking primitive in the frontend."

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --all-targets

  # The Rust job runs on Linux and therefore compiles the Linux `#[cfg(...)]`
  # branches, but would leave the Windows-specific code uncovered: the menu
  # without an application submenu, and the `explorer /select,` invocation.
  # Without this job an error there would surface only at release time.
  windows:
    name: Rust on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --all-targets

  # Compiling and passing the tests says the logic works. It says nothing about
  # whether the window opens: the webview is a different component on every
  # platform, and the parts these jobs exercise (drag and drop registration,
  # the menu, the embedded assets) have no unit test and never will.
  #
  # These two are smoke tests, and it is worth being precise about what they
  # prove: the application starts, shows a window with the expected title, and
  # is still alive some seconds later. They do not click anything.
  smoke-linux:
    name: Starts on Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Ubuntu 22.04 to match the release runner: the point is to start what
      # users are given, not something built against newer libraries.
      - name: Tauri system dependencies and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf \
            xvfb \
            xdotool \
            imagemagick

      - run: npm ci

      # `--no-bundle` stops before producing the .deb and .AppImage: the binary
      # is enough to start, and packaging would add minutes for nothing.
      - name: Build the application
        run: npm run tauri build -- --no-bundle

      - name: Start it and check the page renders
        env:
          # WebKitGTK falls over on headless runners without these: it tries to
          # use GPU compositing and a dmabuf renderer that Xvfb does not provide.
          WEBKIT_DISABLE_COMPOSITING_MODE: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: |
          set -euo pipefail
          BIN=src-tauri/target/release/open-takeout-hub
          test -x "$BIN" || { echo "::error::binary not found at $BIN"; exit 1; }

          xvfb-run -a --server-args="-screen 0 1280x800x24" bash -eo pipefail -c '
            "'"$BIN"'" &
            APP=$!

            # `--sync` waits for the window instead of polling: if it never
            # appears, the timeout is what fails, not a guess about how long
            # starting takes.
            if ! timeout 60 xdotool search --sync --name "Open Takeout Hub" >/dev/null; then
              echo "::error::no window named \"Open Takeout Hub\" appeared within 60 s"
              kill $APP 2>/dev/null || true
              exit 1
            fi

            # The window is not evidence that anything loaded: Tauri opens it
            # before the webview does a thing. WebKitGTK runs the page in a
            # separate WebKitWebProcess, which exists only once there is
            # content to draw, so that is what gets checked.
            for _ in $(seq 30); do
              pgrep -f WebKitWebProcess >/dev/null && break
              sleep 2
            done
            if ! pgrep -f WebKitWebProcess >/dev/null; then
              echo "::error::WebKitGTK never started a web process: the page did not load"
              kill $APP 2>/dev/null || true
              exit 1
            fi

            # A window that appears and then dies is not a working application.
            sleep 10
            if ! kill -0 $APP 2>/dev/null; then
              echo "::error::the application exited within ten seconds of opening its window"
              exit 1
            fi

            import -window root smoke-linux.png || true
            kill $APP 2>/dev/null || true
          '
          echo "The page rendered and the application stayed alive."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux
          path: smoke-linux.png
          if-no-files-found: warn

  smoke-windows:
    name: Starts on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the application
        run: npm run tauri build -- --no-bundle

      # The check itself lives in a script: it needs a PowerShell here-string,
      # whose terminator has to sit at column zero, and inside a YAML block
      # scalar that breaks the indentation and the workflow stops parsing.
      - name: Start it and check the page renders
        shell: pwsh
        run: .github/scripts/smoke-windows.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: smoke-windows.png
          if-no-files-found: warn

  # The unit tests run on synthetic trees built in a temporary folder. This job
  # instead generates a real multi-archive Takeout and puts it through the whole
  # chain, on the two systems nobody here can try by hand.
  #
  # It exists because the interesting cross-platform bugs live in the
  # filesystem, not in the logic: Windows is case-insensitive, caps paths at 260
  # characters unless long paths are enabled, and refuses a handful of reserved
  # names. This export is full of long names with spaces and accents, nested
  # several folders deep, which is exactly where those limits bite.
  files:
    name: Real files on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
          - os: windows-latest
            label: Windows
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Windows ships `python`, not `python3`: the action puts both on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      # Two hundred megabytes across three archives: enough to exercise the
      # merge, the album folders and the shortened sidecar names, small enough
      # not to spend the runner's time writing bytes we already measured on a
      # real fifteen gigabyte series.
      - name: Generate a Takeout series
        shell: bash
        run: |
          OTH_GB=0.2 OTH_GB_PER_ARCHIVE=0.08 \
            python3 tools/generate_takeout_series.py "$RUNNER_TEMP/series"
          ls -la "$RUNNER_TEMP/series"

      # Debug rather than release: this checks that the files come out right,
      # not how fast. A release build would cost minutes for no more certainty.
      - name: Extract the series and analyse it
        shell: bash
        working-directory: src-tauri
        env:
          SERIES: ${{ runner.temp }}/series
          OUTPUT: ${{ runner.temp }}/extracted
        run: cargo test extracts_a_real_series -- --ignored --nocapture

      - name: Repair a folder and set the sidecars aside
        shell: bash
        working-directory: src-tauri
        env:
          FOLDER: ${{ runner.temp }}/extracted/Takeout/Google Foto/Foto da 2019
        run: cargo test repairs_then_sets_the_sidecars_aside -- --ignored --nocapture

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type checking and build
        run: npm run build
