name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The check that holds up the project's promise. It runs first and on its own:
  # if anyone introduces a network crate, that has to be the first thing seen
  # failing, not a line lost at the bottom of a build log.
  privacy:
    name: Local-first constraint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: No network, telemetry or updater crates
        working-directory: src-tauri
        run: cargo deny check

      - name: No fetch or XMLHttpRequest in the frontend
        run: |
          # The CSP would block them at runtime anyway, but a console error is
          # a worse diagnosis than a failing build.
          if grep -rnE '\b(fetch|XMLHttpRequest|WebSocket|EventSource)\s*\(' src/; then
            echo "::error::Found a networking primitive in the frontend."
            exit 1
          fi
          echo "Nessuna primitiva di rete nel frontend."

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --all-targets

  # The Rust job runs on Linux and therefore compiles the Linux `#[cfg(...)]`
  # branches, but would leave the Windows-specific code uncovered: the menu
  # without an application submenu, and the `explorer /select,` invocation.
  # Without this job an error there would surface only at release time.
  windows:
    name: Rust on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --all-targets

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type checking and build
        run: npm run build
