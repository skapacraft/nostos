#
# Builds the Flatpak and runs the linter Flathub runs on submission.
#
# It exists so the answer to "does it still build as a Flatpak" is a job that
# ran this morning rather than a memory of it working once. flatpak-builder
# does not run on macOS, so without this the package could only be tested by
# someone who happens to be sitting at a Linux machine.
name: Flatpak

on:
  push:
    branches: [main]
    paths:
      - 'packaging/flatpak/**'
      - 'src-tauri/**'
      - 'src/**'
      - 'package-lock.json'
      - '.github/workflows/flatpak.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and lint the Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - uses: actions/checkout@v5

      # Pinned to a commit rather than to a branch: this step runs code from
      # another repository, and a moving reference would mean the build changes
      # without anything here changing. The Rust generator is a single script;
      # the node one is a Python package and has to be installed.
      - name: Fetch the source generators
        env:
          TOOLS_REF: 737c0085912f9f7dabf9341d4608e2a77a51a73a
        run: |
          set -euo pipefail
          curl -fsSL -o flatpak-cargo-generator.py \
            "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/${TOOLS_REF}/cargo/flatpak-cargo-generator.py"
          python3 -m pip install --quiet aiohttp toml
          python3 -m pip install --quiet \
            "git+https://github.com/flatpak/flatpak-builder-tools@${TOOLS_REF}#subdirectory=node"

      - name: Declare every Rust dependency
        run: python3 flatpak-cargo-generator.py src-tauri/Cargo.lock -o packaging/flatpak/cargo-sources.json

      - name: Declare every npm dependency
        run: flatpak-node-generator npm package-lock.json -o packaging/flatpak/node-sources.json

      - name: Report what was declared
        run: |
          for f in cargo node; do
            printf '%-8s %s entries\n' "$f" \
              "$(python3 -c "import json,sys; print(len(json.load(open('packaging/flatpak/${f}-sources.json'))))")"
          done

      # Temporary: lets the Flathub submission be prepared without needing
      # Python 3.10+ locally to run flatpak-node-generator. Remove once the
      # submission is filed.
      - uses: actions/upload-artifact@v7
        with:
          name: flathub-source-lists
          path: |
            packaging/flatpak/cargo-sources.json
            packaging/flatpak/node-sources.json

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: nostos.flatpak
          manifest-path: packaging/flatpak/com.skapacraft.nostos.yml
          cache-key: flatpak-${{ hashFiles('src-tauri/Cargo.lock', 'package-lock.json') }}
          # The same check Flathub runs when the submission is opened.
          run-tests: false
          verbose: false

      - name: Lint the manifest and the metadata as Flathub does
        run: |
          set -euo pipefail
          flatpak install -y --noninteractive flathub org.flatpak.Builder || true
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            manifest packaging/flatpak/com.skapacraft.nostos.yml
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            appstream src-tauri/packaging/com.skapacraft.nostos.metainfo.xml
