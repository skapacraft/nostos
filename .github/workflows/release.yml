name: Release

# Tauri bundles do not cross-compile between platforms: macOS produces neither
# .msi nor .deb. Every system has to be built on its own runner, which is why
# this file exists instead of a local script.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon + Intel)
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # The oldest Linux runner available: the runner's glibc and webkit2gtk
          # set the minimum compatibility of the package produced. Building on a
          # recent distribution yields binaries that will not start on LTS ones.
          - os: ubuntu-22.04
            label: Linux (deb + AppImage)
            args: ""
            rust-targets: ""
          - os: windows-latest
            label: Windows (msi + nsis)
            args: ""
            rust-targets: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Open Takeout Hub ${{ github.ref_name }}
          releaseBody: |
            Local processing of Google Takeout exports.

            No network connections, no telemetry, no automatic updates. The
            constraint is verified in CI by the "Local-first constraint" job.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Tauri does not produce a portable executable: its Windows bundles are
      # installers. The raw binary already is one, so we publish it separately.
      - name: Windows portable executable
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: open-takeout-hub-portable-windows
          path: src-tauri/target/release/open-takeout-hub.exe
          if-no-files-found: error
