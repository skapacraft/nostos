name: Release

# I bundle di Tauri non si compilano da una piattaforma all'altra: da macOS non
# escono .msi né .deb. Ogni sistema va costruito sul proprio runner, ed è il
# motivo per cui questo file esiste invece di uno script locale.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon + Intel)
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Il runner Linux più vecchio disponibile: glibc e webkit2gtk del
          # runner fissano la compatibilità minima del pacchetto prodotto.
          # Compilare su una distro recente produce binari che non partono su
          # quelle in LTS.
          - os: ubuntu-22.04
            label: Linux (deb + AppImage)
            args: ""
            rust-targets: ""
          - os: windows-latest
            label: Windows (msi + nsis)
            args: ""
            rust-targets: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dipendenze di sistema Tauri
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Nostos ${{ github.ref_name }}
          releaseBody: |
            Elaborazione locale degli export Google Takeout.

            Nessuna connessione di rete, nessuna telemetria, nessun
            aggiornamento automatico. Il vincolo è verificato in CI dal job
            "Vincolo local-first".
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Tauri non produce un eseguibile portatile: i suoi bundle Windows sono
      # installer. Il binario grezzo lo è già, quindi lo pubblichiamo a parte.
      - name: Eseguibile portatile Windows
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nostos-portable-windows
          path: src-tauri/target/release/nostos.exe
          if-no-files-found: error
