[package]
name = "nostos"
version = "1.1.1"
description = "Local-first, privacy-focused processor for Google Takeout archives"
authors = ["SkapaCraft"]
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
repository = "https://github.com/skapacraft/nostos"
homepage = "https://skapacraft.com"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nostos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Nessuna crate HTTP/telemetria: l'app non apre socket di rete.
tauri = { version = "2", features = [] }
# The file dialog backend is chosen at build time. GTK by default, which is
# what the .deb, .rpm and the AppImage expect. The Flatpak build selects the
# XDG portal instead: the portal hands back exactly the folder the user picked,
# so the sandbox never needs access to the whole home directory.
tauri-plugin-dialog = { version = "2.7.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Google comprime i Takeout con deflate. Disattivare le altre codifiche toglie
# bzip2, zstd, lzma e ppmd dal grafo: meno superficie, build più rapida.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
kamadak-exif = "0.6.1"
walkdir = "2.5.0"
thiserror = "2.0.19"
filetime = "0.2.29"
chrono = { version = "0.4.45", features = ["serde"] }
little_exif = "0.6.23"
rayon = "1.12.0"
blake3 = "1.8.5"
unicode-normalization = "0.1.25"
tzf-rs = "1.3.7"
chrono-tz = "0.10.4"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
sys-locale = "0.3.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[features]
default = ["dialog-gtk3"]
dialog-gtk3 = ["tauri-plugin-dialog/gtk3"]
dialog-portal = ["tauri-plugin-dialog/xdg-portal"]
