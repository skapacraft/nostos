  SPDX-License-Identifier: GPL-3.0-or-later

  Source of the application icons. Every size is generated from here:

      npm run tauri icon src-tauri/icons/app-icon.svg

  Home Arc: an orbit that has not closed yet, with the piece travelling back
  to complete it. Nostos is the return, so the mark is about the return
  itself rather than about photographs specifically — the earlier "photo
  with a clock" mark told only the photo half of what the application does,
  the same narrowing a photo-specific store name was turned down for once
  contacts and calendars were in scope.

  No arrowhead: the very first version of this icon was a folder with an
  arrow coming out of it, and it was replaced because an upward arrow reads
  as "upload" in every icon vocabulary there is. The dot here is a point
  arriving, not a direction pointing outward.

  Colour follows the site's current accent (#7f9cff on #0b0d10) rather than
  the emerald the icon shipped with originally: the site moved to this
  palette after the icon's colours were set, and the two had drifted apart.
  The rest of the application interface still uses the older emerald accent
  throughout; recolouring that is a separate, larger decision this file does
  not make on its own.

  The corner radius of 22% approximates the rounded square macOS draws around
  app icons, and stays reasonable on Windows and Linux, which do not mask.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <rect width="1024" height="1024" rx="228" fill="#0b0d10" />
  <circle cx="512" cy="512" r="300" fill="none" stroke="#3c4f8f" stroke-width="18" />
  <path
    d="M 512 212 A 300 300 0 0 1 772 662"
    fill="none"
    stroke="#7f9cff"
    stroke-width="76"
    stroke-linecap="round"
  />
  <circle cx="772" cy="662" r="54" fill="#7f9cff" />
</svg>
