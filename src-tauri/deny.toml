# Configurazione cargo-deny.
#
# Questo file è il motivo per cui la promessa "nessuna connessione di rete"
# resta vera nel tempo. Un README invecchia al primo `cargo add`: la sezione
# [bans] invece fa fallire la build.
#
#   cargo deny --manifest-path src-tauri/Cargo.toml check

[graph]
# Controlliamo tutte le piattaforme su cui l'app viene distribuita, altrimenti
# una dipendenza di rete introdotta solo per Windows passerebbe inosservata
# durante lo sviluppo su macOS.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = false

[advisories]
version = 2
yanked = "deny"

# Le vulnerabilità restano un errore bloccante (comportamento predefinito).
#
# Gli avvisi "unmaintained" invece valgono solo per le dipendenze dirette. Il
# grosso di quelli transitivi arriva dalle binding GTK3, che Tauri usa
# obbligatoriamente su Linux, e da crate interne di `tauri-utils`: sono 15
# avvisi su cui non possiamo agire e che non descrivono falle sfruttabili.
# Elencarli a mano significherebbe una lista che invecchia a ogni release di
# Tauri e che, a forza di essere aggiornata senza pensarci, finirebbe per
# coprire anche un avviso che conta davvero.
unmaintained = "workspace"

ignore = [
    # quick-xml 0.37.5, tirato dentro da little_exif. Due DoS: tempo quadratico
    # su attributi duplicati e allocazione illimitata di dichiarazioni di
    # namespace. Non esiste una 0.37.x corretta e little_exif non permette di
    # disattivare l'XMP.
    #
    # Perché è accettabile qui: in little_exif quick-xml è usato solo da
    # `xmp.rs`, che a sua volta è raggiungibile solo dal percorso PNG. Questo
    # progetto esclude PNG da `EXIF_WRITABLE_EXTENSIONS`, quindi quel codice non
    # viene mai eseguito. L'esclusione è protetta dal test
    # `png_resta_fuori_dalla_scrittura_exif`, che fallisce se qualcuno la
    # rimuove senza accorgersi di riaprire questa superficie.
    #
    # Da togliere quando little_exif passerà a quick-xml 0.41 o successive.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
version = 2
# Il progetto è GPL-3.0-or-later: può assorbire dipendenze permissive, non il
# contrario. Le copyleft forti di terzi vanno valutate caso per caso, quindi
# non sono in lista e fanno fallire il controllo finché non le si esamina.
allow = [
    # Licenza del progetto stesso.
    "GPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    # Dati dei confini dei fusi orari, derivati da OpenStreetMap e distribuiti
    # da `tzf-dist`. È una licenza per banche dati, non per codice: consente la
    # ridistribuzione e obbliga all'attribuzione, che sta nella guida dell'app
    # e nel README. Non contamina il codice del progetto.
    "ODbL-1.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

# Il cuore del vincolo architetturale: nessun client HTTP, nessun socket,
# nessun canale verso l'esterno. Aggiungere una di queste crate rompe la CI,
# e va fatto solo con una modifica cosciente di questo file.
deny = [
    # Client HTTP e stack di rete
    { name = "reqwest", reason = "client HTTP: viola il vincolo local-first" },
    { name = "hyper", reason = "stack HTTP" },
    { name = "hyper-util", reason = "stack HTTP" },
    { name = "h2", reason = "HTTP/2" },
    { name = "ureq", reason = "client HTTP" },
    { name = "isahc", reason = "client HTTP" },
    { name = "surf", reason = "client HTTP" },
    { name = "attohttpc", reason = "client HTTP" },
    { name = "curl", reason = "client HTTP" },
    { name = "curl-sys", reason = "client HTTP" },
    { name = "actix-web", reason = "server HTTP" },
    { name = "axum", reason = "server HTTP" },
    { name = "warp", reason = "server HTTP" },
    { name = "tiny_http", reason = "server HTTP" },
    { name = "tungstenite", reason = "WebSocket" },
    { name = "tokio-tungstenite", reason = "WebSocket" },
    { name = "quinn", reason = "QUIC" },

    # TLS: non serve a un'app che non parla con nessuno
    { name = "rustls", reason = "TLS: nessuna connessione da cifrare" },
    { name = "native-tls", reason = "TLS" },
    { name = "openssl", reason = "TLS" },
    { name = "openssl-sys", reason = "TLS" },

    # Telemetria e crash reporting
    { name = "sentry", reason = "crash reporting verso terzi" },
    { name = "sentry-core", reason = "crash reporting verso terzi" },
    { name = "opentelemetry", reason = "telemetria" },
    { name = "tracing-opentelemetry", reason = "telemetria" },

    # Plugin Tauri che aprirebbero superfici verso l'esterno
    { name = "tauri-plugin-http", reason = "espone HTTP al frontend" },
    { name = "tauri-plugin-updater", reason = "aggiornamenti automatici" },
    { name = "tauri-plugin-opener", reason = "apre URL nel browser di sistema" },
    { name = "tauri-plugin-shell", reason = "esecuzione di comandi arbitrari" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
