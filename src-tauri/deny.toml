# cargo-deny configuration.
#
# This file is why the promise "no network connections" stays true over time. A
# README ages badly at the first `cargo add`: the [bans] section fails the build
# instead.
#
#   cargo deny --manifest-path src-tauri/Cargo.toml check

[graph]
# Every platform the application ships on gets checked: a network dependency
# introduced for Windows alone would otherwise pass unnoticed while developing
# on macOS.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = false

[advisories]
version = 2
yanked = "deny"

# Vulnerabilities stay a blocking error, which is the default.
#
# "unmaintained" advisories apply to direct dependencies only. The bulk of the
# transitive ones come from the GTK3 bindings, which Tauri requires on Linux,
# and from crates internal to `tauri-utils`: fifteen advisories nothing can be
# done about, describing no exploitable flaw. Listing them by hand would mean a
# list that ages at every Tauri release and that, updated out of habit, ends up
# covering the one advisory that matters.
unmaintained = "workspace"

# "unsound" advisories are checked everywhere, direct and transitive alike.
#
# This is not the default, and turning it on was the result of finding out the
# hard way. Dependabot reported RUSTSEC-2024-0429 against `glib` while this
# check said "advisories ok": with `version = 2`, cargo-deny reports
# vulnerabilities but stays silent on informational advisories unless asked.
# Two tools disagreeing is useful; two tools that never disagree because one of
# them is not looking is not.
unsound = "all"

ignore = [
    # quick-xml 0.37.5, pulled in by little_exif. Two denial of service issues:
    # quadratic time on duplicate attributes, and unbounded allocation of
    # namespace declarations. There is no fixed 0.37.x and little_exif exposes
    # no way to disable XMP.
    #
    # Why it is acceptable here: inside little_exif, quick-xml is used only by
    # `xmp.rs`, which in turn is reachable only from the PNG path. This project
    # excludes PNG from `EXIF_WRITABLE_EXTENSIONS`, so that code never runs. The
    # exclusion is guarded by the test `png_stays_out_of_exif_writing`, which
    # fails if anyone removes it without noticing they are reopening this
    # surface.
    #
    # Remove when little_exif moves to quick-xml 0.41 or later.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # glib 0.18.5, reached through gtk -> muda -> tauri. `VariantStrIter` passed
    # an immutable reference where the C function writes an out-argument, and
    # recent compilers discard those writes under optimisation, leaving a NULL
    # pointer where a C string was expected.
    #
    # Why it is acceptable here, in the order that matters:
    #
    # - it is Linux only. `cargo tree -i glib` finds nothing on macOS or
    #   Windows, because the GTK stack exists on Linux alone;
    # - the affected functions are the `VariantStrIter` iterators. This project
    #   never touches GVariant: the names appear nowhere in `src/`. Reaching
    #   them requires GTK's own code to iterate a string variant;
    # - the outcome is a NULL dereference, that is a crash. It exposes nothing
    #   and executes nothing, which matters for an application whose promise is
    #   about data staying put;
    # - it cannot be fixed here. The first patched version is 0.20.0, and the
    #   0.18.x line is what Tauri 2 requires. Dependabot said as much when it
    #   reported that the latest installable version is 0.18.5.
    #
    # Remove when Tauri moves to gtk-rs 0.20.
    "RUSTSEC-2024-0429",
]

[licenses]
version = 2
# The project is GPL-3.0-or-later: it can absorb permissive dependencies, not
# the other way round. Strong copyleft from third parties needs judging case by
# case, so it is not on the list and fails the check until someone looks at it.
allow = [
    # The project's own licence.
    "GPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    # Time zone boundary data, derived from OpenStreetMap and distributed by
    # `tzf-dist`. It is a database licence, not a code one: it permits
    # redistribution and requires attribution, which is in the application guide
    # and in ACKNOWLEDGEMENTS.md. It does not affect the project's own code.
    "ODbL-1.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

# The heart of the architectural constraint: no HTTP client, no socket, no
# channel to the outside. Adding one of these crates breaks CI, and should only
# happen through a deliberate change to this file.
deny = [
    # HTTP clients and networking stacks
    { name = "reqwest", reason = "HTTP client: breaks the local-first constraint" },
    { name = "hyper", reason = "HTTP stack" },
    { name = "hyper-util", reason = "HTTP stack" },
    { name = "h2", reason = "HTTP/2" },
    { name = "ureq", reason = "HTTP client" },
    { name = "isahc", reason = "HTTP client" },
    { name = "surf", reason = "HTTP client" },
    { name = "attohttpc", reason = "HTTP client" },
    { name = "curl", reason = "HTTP client" },
    { name = "curl-sys", reason = "HTTP client" },
    { name = "actix-web", reason = "HTTP server" },
    { name = "axum", reason = "HTTP server" },
    { name = "warp", reason = "HTTP server" },
    { name = "tiny_http", reason = "HTTP server" },
    { name = "tungstenite", reason = "WebSocket" },
    { name = "tokio-tungstenite", reason = "WebSocket" },
    { name = "quinn", reason = "QUIC" },

    # TLS: pointless in an application that talks to nobody
    { name = "rustls", reason = "TLS: no connection to encrypt" },
    { name = "native-tls", reason = "TLS" },
    { name = "openssl", reason = "TLS" },
    { name = "openssl-sys", reason = "TLS" },

    # Telemetry and crash reporting
    { name = "sentry", reason = "crash reporting to a third party" },
    { name = "sentry-core", reason = "crash reporting to a third party" },
    { name = "opentelemetry", reason = "telemetry" },
    { name = "tracing-opentelemetry", reason = "telemetry" },

    # Tauri plugins that would open surfaces to the outside
    { name = "tauri-plugin-http", reason = "exposes HTTP to the frontend" },
    { name = "tauri-plugin-updater", reason = "automatic updates" },
    { name = "tauri-plugin-opener", reason = "opens URLs in the system browser" },
    { name = "tauri-plugin-shell", reason = "runs arbitrary commands" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
